[project]
name = "ml-for-finance"
version = "0.1.0"
description = "Paper reproduction and deep hedging notebooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.4",
    "yfinance>=0.2.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
